<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baby Fútbol al Día - Elegí tu zona</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="portada.css" />
  </head>
  <body>
    <div class="portada-header">
      <img src="perfil_babyfutbol.jpg" alt="Baby Fútbol al Día" />
      <h1>Baby Fútbol al Día</h1>
      <p>Elegí tu zona de ONFI</p>
    </div>

    <div id="aviso" class="aviso-zona" style="display:none"></div>
    <div id="zonas" class="zonas-grid"></div>

    <footer class="pie-pagina">
      Información no oficial, armada con datos publicados por las ligas y por colaboradores.
      Puede tener errores: ayudanos a corregirlos por DM en
      <a href="https://www.instagram.com/baby_futbol_al_dia/" target="_blank" rel="noopener">@baby_futbol_al_dia</a>.
    </footer>

    <script src="zonas.js"></script>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var zonas = window.ZONAS || [];
        var activa = function (id) {
          return zonas.find(function (z) { return z.id === id && z.estado === "activa"; });
        };

        // Link directo: index.html?zona=8
        var pedida = parseInt(params.get("zona"), 10);
        if (activa(pedida)) { location.replace("zona.html?zona=" + pedida); return; }

        // Visitantes que ya eligieron una zona entran directo (salvo que pidan cambiar de zona)
        if (!params.has("elegir")) {
          try {
            var guardada = parseInt(localStorage.getItem("zonaElegida"), 10);
            if (activa(guardada)) { location.replace("zona.html?zona=" + guardada); return; }
          } catch (e) {}
        }

        var sin = parseInt(params.get("sinzona"), 10);
        if (sin) {
          var aviso = document.getElementById("aviso");
          aviso.textContent = "La Zona " + sin + " todavía no está disponible. Elegí una de las zonas habilitadas.";
          aviso.style.display = "block";
        }

        var IG = "https://www.instagram.com/baby_futbol_al_dia/";
        var esc = function (t) {
          return String(t).replace(/[&<>"]/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
          });
        };
        // primero las zonas habilitadas, después las próximas
        var orden = zonas.slice().sort(function (a, b) {
          return (a.estado === "activa" ? 0 : 1) - (b.estado === "activa" ? 0 : 1) || a.id - b.id;
        });
        document.getElementById("zonas").innerHTML = orden.map(function (z) {
          if (z.estado === "activa") {
            var base = "zona.html?zona=" + z.id;
            // la tarjeta NO es un link entero: adentro hay un link por liga y un botón "Entrar"
            return '<div class="zona-card activa">' +
              "<h2>" + esc(z.nombre) + "</h2>" +
              '<ul class="ligas">' + (z.ligas || []).map(function (l) {
                var liga = typeof l === "string" ? { nombre: l } : l;
                var href = liga.id ? base + "&liga=" + encodeURIComponent(liga.id) : base;
                return '<li><a href="' + href + '">' + esc(liga.nombre) + "</a></li>";
              }).join("") + "</ul>" +
              '</div>';
          }
          return '<div class="zona-card pronto"><h2>' + esc(z.nombre) + "</h2>" +
            '<span class="etiqueta">Próximamente</span>' +
            '<p class="ayuda">¿Sos de esta zona? <a href="' + IG + '" target="_blank" rel="noopener">Ayudanos a armarla por DM</a></p></div>';
        }).join("");
      })();
    </script>
  </body>
</html>
